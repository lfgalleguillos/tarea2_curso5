<!DOCTYPE html>
<html lang="es" data-bs-theme="dark"><head>
        
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        
            <!-- Bootstrap CSS con el tema Cerulean de Bootswatch -->
            <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/cosmo/bootstrap.min.css" rel="stylesheet">
        
        <title>
    Bienvenido  iA MovieAssist
</title>
        
    </head>
    <body style="background: white;">
        <!-- Your page content -->
        
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <!-- Contenedor de bienvenida -->
            <div class="p-5 border rounded shadow-sm bg-light">
                <h2 class="h1 text-center text-primary mb-5">iA MovieAssist</h2>
                

                <!-- Formulario de login -->
                <form action="/login" method="POST">
                    <div class="form-group mb-3">
                        <label class="h6 text-info" for="email">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required="" placeholder="Ingresa tu correo electrónico">
                    </div>
                    <div class="form-group mb-3">
                        <label class="h6 text-info" for="password">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required="" placeholder="Ingresa tu contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                </form>

                <!-- Enlace a página de registro -->
                <p class="mt-3 text-center">¿No tienes cuenta? <a href="/">Regístrate aquí</a></p>
            </div>
        </div>
    </div>


        
            <!-- Optional JavaScript -->
            <!-- Bootstrap Bundle JS (con Popper.js) -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
    
</body></html>
